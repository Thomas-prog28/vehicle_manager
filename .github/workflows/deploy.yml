name: CI/CD - Tests & Déploiement Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Exécution des tests PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, gd
          coverage: none

      - name: Installation des dépendances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Préparation de l'environnement de test
        run: |
          echo "APP_ENV=test" > .env.test.local
          echo "APP_SECRET=test_secret_ci_key_32_characters" >> .env.test.local
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env.test.local
          echo "GEMINI_API_KEY=fake_ci_key" >> .env.test.local
          echo "MAILER_DSN=null://null" >> .env.test.local
          php bin/console doctrine:schema:create --env=test

      - name: Lancement des tests PHPUnit
        run: php bin/phpunit

  deploy:
    name: Déploiement sur Alwaysdata
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Déploiement SSH sur Alwaysdata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ssh-vehicle-management.alwaysdata.net
          username: vehicle-management
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            set -e
            cd ~/www/vehicle_manager
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php bin/console importmap:install
            php bin/console tailwind:build --minify
            php bin/console asset-map:compile
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console cache:clear
